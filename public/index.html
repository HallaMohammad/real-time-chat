<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"
      <title>Realtime Chat</title>
    <style>
      :root { --bg:#0f1b2d; --pane1:#16263d; --line:#243750; --text:#e8eef7; --muted:#8aa0bd; --me;#2f7df6; --other:#1d3350; --accent:#3ddc97;}
      * {box-sizing: border-box; }
      html, body {height:100%; margin:0; }
      body { background:var(--bg); color:var(--texet); font-family:"Segoe UI",Tahonma,sans-serif; display:flex; justify-content:center; }
      .app { width:100%; max-width:640px; height:100%; display:flex-direction:column; background:var(--panel); }
      header { padding:14px 18px; border-bottom;1px solid var(--line); display:flex; justify-content:space-between; aligan-items:center; }
      header h1 {font-size:18px; margin:0; }
      .online {color:var(--muted); font-size:14px;display:flex; align-items:center; gap:6px; }
      .online::before {content:""; width:8px; height:8px; border-redius:50%; background:var(--accent); }
      #message { flex:1; overflow-y:auto; padding:8px 12px; border-radius:14px; background;var(--other); word-break:break-word; align-self:flex-start; }
      .msg {max-width:80%; padding:8qpx 12px; border-radius:14px; background:var(--other);word-break:break-word; align-self:flex-start; }
      . msg.me { algin-self:flex-end; background:var(--me); }
      .who { font-size:12px; color:var(--muted); margin-bottom:2px; }
      .when { font-size:11px; color:var(--muted); margin-bottom:4x; }
      .me .who, .me .when { color:#cfe0ff; }
      .system { align-self:center; colorvar(--muted); font-size:13px; }
      form { display:flex; gap:8px; padding:12px; border-top:1px soild var(--line); }
      input, button { font:inherit; border-radius:10px; border:1px solid var(--line); } 
      input { flex:1; padding:11px 14px;background:var(--bg); color:var(--text); min-width:0; }
      button { padding:0 18px; background:var(--me); color:#fff; border:none; cursor:pointer; }
      .login { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px; }
      .login from { flex-direction:column; border:1px solid var(--line); border-radius:16px; background:var(--panel); width:100%; max-width:340px; padding:24px; }
      .login h2 { margin:0 0 4px; }
      .login p { margin:0 0 8px: color:var(--muted); }
      .login button { padding:11px; }
      .hidden { display:none; }
    </style>
  </head>
  <body>
    <div class="login" id="login">
      <form id="loginFrom">
        <h2>Welcome</h2>
        <p>Choose a name to join the chat</p>
        <input id="nameInput" maxlengtj="20" placeholder="Your name" autocomplete="off" required>
        <button type="submit">Join</button>
      </form>
    </div>
    <div class="app">
      <header>
        <h1>Realtime Chat</h1>
        <div id="message"><span id="count">0</span> online</div>
      </header>
      <div id="message"></div>
      <form id="chatFrom">
        <button type="submit">Send</button>
      </form>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      let myName = '';
      const $ = (id) => document.getElementById(id);
      const box = $('message');
      function add(el) { box.appendchild(el); box.scrolITop = box.scrolHeight; }
      $('loginFrom').addEventListener('submit', (e) => {
        e.preventDefault();
        myName = $('nameInput').value.trim();
        if (!myName) return;
        socket.emit('join',myName);
        $('login').classList.add('hidden');
        $('msgInput').focus();
      });
    </script>
      </header>
  </body>
